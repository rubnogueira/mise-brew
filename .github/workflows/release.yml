name: Release

# Publishes a GitHub release with prebuilt binaries when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # installs Go from mise.toml

      - name: Test
        run: |
          go vet ./...
          mise run test

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}" arch="${target#*/}"
            name="mise-brew-${version}-${os}-${arch}"
            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.miseBrewVersion=${version}" \
              -o "build/$name/brew" .
            cp README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "mise-brew ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
