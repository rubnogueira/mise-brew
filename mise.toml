[tools]
go = "1.27"

[tasks.build]
description = "Build bin/brew"
run = "go build -trimpath -ldflags='-s -w' -o bin/brew ./cmd/brew"

[tasks.test]
description = "Vet and run the unit tests"
run = "go vet ./... && go test ./..."

[tasks.install]
description = "Install bin/brew as $PREFIX/bin/brew (default: the Homebrew prefix)"
depends = ["build"]
run = '''
prefix="${PREFIX:-$(./bin/brew --prefix)}"
mkdir -p "$prefix/bin"
install -m 0755 bin/brew "$prefix/bin/brew"
echo "installed $prefix/bin/brew"
'''
